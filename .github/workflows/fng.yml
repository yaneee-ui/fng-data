# 저장 위치: <저장소>/.github/workflows/fng.yml
name: fetch-fear-greed
on:
  schedule:
    - cron: "0 6 * * 1-5"    # 한국 15:00 무렵 (직전 미국 마감 값)
    - cron: "30 22 * * 1-5"  # 미국 마감 직후
  workflow_dispatch: {}       # 수동 실행 버튼 (첫 테스트용)
permissions:
  contents: write
concurrency:
  group: fng
  cancel-in-progress: false  
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch CNN Fear & Greed
        run: |
          mkdir -p data
          code=$(curl -sS -m 30 -o raw.json -w "%{http_code}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -H "Referer: https://edition.cnn.com/" -H "Origin: https://edition.cnn.com" \
            "https://production.dataviz.cnn.io/index/fearandgreed/graphdata")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then head -c 300 raw.json; exit 1; fi
          python3 - <<'PY'
          import json
          d = json.load(open("raw.json"))["fear_and_greed"]
          out = {k: d.get(k) for k in ("score","rating","timestamp","previous_close","previous_1_week","previous_1_month","previous_1_year")}
          json.dump(out, open("data/fng.json","w"), ensure_ascii=False, indent=1)
          print(out)
          PY
            - name: Commit
        run: |
          git config user.name "fng-bot"; git config user.email "fng-bot@users.noreply.github.com"
          git add data/fng.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "update fng"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
