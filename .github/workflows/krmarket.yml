# 저장 위치: <저장소>/.github/workflows/krmarket.yml  (기존 파일을 통째로 교체)
name: fetch-kr-market
on:
  schedule:
    - cron: "31 6 * * 1-5"   # 한국 15:31 (정규장 마감 직후, 시간외 거래 반영 전)
    - cron: "36 6 * * 1-5"   # 15:36 재시도
    - cron: "55 6 * * 1-5"   # 15:55 최후 재시도(정규장 스냅샷이 없을 때만 기록)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: krmarket
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Naver sector and stock data
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, sys, time, datetime, urllib.request, urllib.error

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          BASE = "https://m.stock.naver.com/api/stocks"
          MIN_VALUE_BIG = 100    # 시총 5,000억 이상 종목: 거래대금 100억 원 이상만 '상승 종목' 후보
          MIN_VALUE_SMALL = 30   # 시총 300억~5,000억 소형주: 거래대금 30억 원 이상만 후보
          MIN_PCT = 5.0          # 상승 종목 후보: 등락률 5% 이상만 (그 안에서 거래대금 순으로 정렬)

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json", "Referer": "https://m.stock.naver.com/"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  print("HTTP error", e.code, url, e.read()[:300])
                  raise

          def num(s):
              try:
                  return float(str(s).replace(",", "").strip())
              except Exception:
                  return None

          def sectors():
              out, status = [], None
              for page in range(1, 11):
                  d = get_json(f"{BASE}/industry?page={page}&pageSize=30")
                  status = d.get("marketStatus")
                  groups = d.get("groups", [])
                  for g in groups:
                      p = num(g.get("changeRate"))
                      if p is not None:
                          out.append({"name": g["name"], "pct": p, "rise": g.get("riseCount"), "fall": g.get("fallCount")})
                  if not groups or len(out) >= d.get("totalCount", 0):
                      break
                  time.sleep(0.2)
              return out, status

          def mv_last(items):
              v = num(items[-1].get("marketValue"))
              return v if v is not None else 0

          def stocks():
              out, small, sample = [], [], None
              for market in ("KOSPI", "KOSDAQ"):
                  for page in range(1, 121):
                      d = get_json(f"{BASE}/marketValue/{market}?page={page}&pageSize=30")
                      items = d.get("stocks", [])
                      if not items:
                          break
                      if sample is None:
                          sample = items[0]
                      big = 0
                      for s in items:
                          mv, p, px = num(s.get("marketValue")), num(s.get("fluctuationsRatio")), num(s.get("closePrice"))
                          if mv is None or p is None or px is None:
                              continue
                          raw = num(s.get("accumulatedTradingValueRaw"))
                          val = raw / 1e8 if raw is not None else None          # 거래대금(억 원)
                          vol = num(s.get("accumulatedTradingVolumeRaw"))        # 거래량(주)
                          if mv >= 5000:
                              big += 1
                          rec = {"name": s["stockName"], "code": s["itemCode"], "market": market,
                                 "price": px, "pct": p, "mcap_eok": mv,
                                 "value_eok": round(val, 1) if val is not None else None,
                                 "volume": int(vol) if vol is not None else None,
                                 "localTradedAt": s.get("localTradedAt")}
                          if s.get("stockEndType") == "stock" and mv >= 5000:
                              if val is not None and val >= MIN_VALUE_BIG:
                                  out.append(rec)
                          elif s.get("stockEndType") == "stock" and mv >= 300:
                              if val is not None and val >= MIN_VALUE_SMALL:
                                  small.append(rec)
                      if not items or (big == 0 and mv_last(items) < 300):   # 시총 300억 미만 구간이면 중단
                          break
                      time.sleep(0.2)
              return out, small, sample

          sec, status = sectors()
          stk, sml, sample = stocks()
          print("sectors", len(sec), "stocks(>=5000억)", len(stk), "small(300~5000억)", len(sml), "marketStatus", status)
          if len(sec) < 30 or len(stk) < 50:
              print("parse looks wrong; abort"); sys.exit(1)

          kst = datetime.timezone(datetime.timedelta(hours=9))
          now = datetime.datetime.now(kst)
          # 15:45 이전 스냅샷만 '정규장 종가', 이후는 시간외(넥스트레이드) 가격이 섞임
          snap = "krx_close" if now.hour * 60 + now.minute <= 15 * 60 + 45 else "after_hours"
          try:
              old = json.load(open("data/kr_market.json"))
              if old.get("date") == now.strftime("%Y-%m-%d") and old.get("snapshot") == "krx_close" and snap == "after_hours":
                  print("keep today's krx_close snapshot; skip"); sys.exit(0)
          except FileNotFoundError:
              pass
          except Exception as e:
              print("old file read failed", e)
          result = {
              "asof_kst": now.strftime("%Y-%m-%d %H:%M"),
              "date": now.strftime("%Y-%m-%d"),
              "marketStatus": status,
              "snapshot": snap,
              "note": "네이버증권(모바일 API) 기준. 시가총액 5,000억 원 이상 보통주(ETF·ETN 제외) 중 등락률 %.1f%% 이상이고 거래대금 %d억 원 이상인 종목을 거래대금 큰 순으로 상위 20개. 신규상장 여부는 구분하지 않음. 가격은 조회 시점의 최신가라 snapshot이 after_hours이면 시간외 가격이 섞임." % (MIN_PCT, MIN_VALUE_BIG),
              "sectors_top": sorted(sec, key=lambda s: -s["pct"])[:10],
              "sectors_bottom": sorted(sec, key=lambda s: s["pct"])[:5],
              "stocks_top": sorted([r for r in stk if r["pct"] >= MIN_PCT], key=lambda s: -s["value_eok"])[:20],
              "stocks_pct_top": sorted(stk, key=lambda s: -s["pct"])[:10],
              "small_note": "시가총액 300억 이상 5,000억 원 미만 보통주(ETF·ETN 제외) 중 등락률 %.1f%% 이상이고 거래대금 %d억 원 이상인 종목을 거래대금 큰 순으로 상위 20개. 상한가·신규상장·거래 과열 종목이 섞일 수 있음." % (MIN_PCT, MIN_VALUE_SMALL),
              "filters": {"min_value_big_eok": MIN_VALUE_BIG, "min_value_small_eok": MIN_VALUE_SMALL, "min_pct": MIN_PCT, "rank_by": "value_eok"},
              "value_top": sorted([r for r in stk + sml if r["value_eok"] is not None], key=lambda r: -r["value_eok"])[:10],
              "stocks_small_top": sorted([r for r in sml if r["pct"] >= MIN_PCT], key=lambda s: -s["value_eok"])[:20],
              "sample_record": sample,
          }
          json.dump(result, open("data/kr_market.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps(result["sectors_top"][:3], ensure_ascii=False))
          print(json.dumps(result["stocks_top"][:3], ensure_ascii=False))
          PY
      - name: Commit
        run: |
          git config user.name "fng-bot"; git config user.email "fng-bot@users.noreply.github.com"
          git add data/kr_market.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "update kr market"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
