# 저장 위치: <저장소>/.github/workflows/krmarket.yml
name: fetch-kr-market
on:
  schedule:
    - cron: "35 6 * * 1-5"   # 한국 15:35 (장 마감 직후)
    - cron: "55 6 * * 1-5"   # 15:55 재시도
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: krmarket
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install beautifulsoup4
      - name: Fetch Naver sector and stock data
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, re, sys, time, datetime, urllib.request
          from bs4 import BeautifulSoup

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Referer": "https://finance.naver.com/"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return BeautifulSoup(r.read().decode("euc-kr", errors="ignore"), "html.parser")

          def num(s):
              s = re.sub(r"[^0-9.\-]", "", s or "")
              return float(s) if s not in ("", "-", ".") else None

          def pct(s):
              s = (s or "").replace(",", "").strip()
              m = re.search(r"([+\-]?)\s*([0-9.]+)\s*%", s)
              if not m:
                  return None
              v = float(m.group(2))
              return -v if m.group(1) == "-" else v

          def sectors():
              soup = get("https://finance.naver.com/sise/sise_group.naver?type=upjong")
              out = []
              for tr in soup.select("table.type_1 tr"):
                  tds = tr.find_all("td")
                  a = tr.find("a")
                  if len(tds) >= 2 and a:
                      p = pct(tds[1].get_text())
                      if p is not None:
                          out.append({"name": a.get_text(strip=True), "pct": p})
              return out

          def stocks():
              out = []
              for sosok, market in ((0, "KOSPI"), (1, "KOSDAQ")):
                  page = 1
                  while page <= 60:
                      soup = get(f"https://finance.naver.com/sise/sise_market_sum.naver?sosok={sosok}&page={page}")
                      rows = 0
                      for tr in soup.select("table.type_2 tbody tr"):
                          tds = tr.find_all("td")
                          a = tr.find("a", href=re.compile(r"code=\d{6}"))
                          if len(tds) < 8 or not a:
                              continue
                          rows += 1
                          code = re.search(r"code=(\d{6})", a["href"]).group(1)
                          price, p, mcap = num(tds[2].get_text()), pct(tds[4].get_text()), num(tds[6].get_text())
                          if price is None or p is None or mcap is None:
                              continue
                          out.append({"name": a.get_text(strip=True), "code": code, "market": market,
                                      "price": price, "pct": p, "mcap_eok": mcap})
                      if rows == 0:
                          break
                      page += 1
                      time.sleep(0.3)
              return out

          sec = sectors()
          stk = stocks()
          print("sectors", len(sec), "stocks", len(stk))
          if len(sec) < 20 or len(stk) < 500:
              print("parse looks wrong; abort"); sys.exit(1)

          kst = datetime.timezone(datetime.timedelta(hours=9))
          now = datetime.datetime.now(kst)
          big = sorted([s for s in stk if s["mcap_eok"] >= 5000], key=lambda s: -s["pct"])[:20]
          result = {
              "asof_kst": now.strftime("%Y-%m-%d %H:%M"),
              "date": now.strftime("%Y-%m-%d"),
              "note": "네이버증권 기준. 시가총액 5,000억 원 이상 종목 중 등락률 상위 20개. 신규상장 여부는 구분하지 않음.",
              "sectors_top": sorted(sec, key=lambda s: -s["pct"])[:10],
              "sectors_bottom": sorted(sec, key=lambda s: s["pct"])[:5],
              "stocks_top": big,
          }
          json.dump(result, open("data/kr_market.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps(result, ensure_ascii=False)[:600])
          PY
      - name: Commit
        run: |
          git config user.name "fng-bot"; git config user.email "fng-bot@users.noreply.github.com"
          git add data/kr_market.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "update kr market"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
